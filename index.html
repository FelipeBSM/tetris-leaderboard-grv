<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tetris Leaderboard</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Dependências locais que você já usa no WebAR -->
  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>
</head>
<body>

  <main class="page-shell">
    <section class="tv">
      <img class="tv-frame" src="TV_Frame.png" alt="" />

      <div class="screen">
        <div class="screen-content">
          <header class="title-block">
            <p class="eyebrow">OPEN CAMPUS // GRV</p>

            <div class="title-row">
              <h1>LEADERBOARD</h1>

              <!-- Visível somente no mobile -->
              <button
                id="enterArButton"
                class="ar-mode-button"
                type="button"
                aria-label="Entrar no modo de realidade aumentada"
              >
                <span class="ar-mode-icon" aria-hidden="true">⌗</span>
                <span>AR MODE</span>
              </button>
            </div>
          </header>

          <div class="leaderboard-card">
            <div class="leaderboard-head row">
              <span>#</span>
              <span>NAME</span>
              <span>PTS</span>
              <span>TIME</span>
            </div>

            <div id="leaderboard" class="leaderboard-body">
              <div class="loading">LOADING SCORES...</div>
            </div>
          </div>
        </div>

        <div class="scanlines"></div>
        <div class="screen-vignette"></div>
        <img class="glass-effect" src="TV_GLASS_EFFECT.png" alt="" />
      </div>
    </section>

    <p id="leaderboardStatus" class="status">CONNECTING...</p>
  </main>


  <section id="arMode" class="ar-mode" aria-hidden="true">
    <div class="ar-topbar">
      <button id="exitArButton" class="ar-back-button" type="button">
        <span aria-hidden="true">←</span>
        <span>LEADERBOARD</span>
      </button>

      <div id="arStatus" class="ar-status">
        Aponte a câmera para o sticker do GRV
      </div>
    </div>

    <a-scene id="arScene"
             mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 12; missTolerance: 5; uiScanning: no;"
             embedded
             renderer="colorManagement: true; physicallyCorrectLights: false; antialias: true; alpha: true;"
             background="transparent: true"
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="trofeuModel" src="./trofeu_grv_retopo.glb"></a-asset-item>
            <a-asset-item id="pucrsLogoModel" src="./pucrs_logo.glb"></a-asset-item>
        </a-assets>
        <a-light type="ambient"
                 color="#ffffff"
                 intensity="0.5">
        </a-light>

        <a-light type="directional"
                 color="#fff4dc"
                 position="-1 2 2"
                 intensity="1">
        </a-light>



        <a-entity id="grvTarget" mindar-image-target="targetIndex: 0">

            <!-- Flutuação -->
            <a-entity id="trofeuContainer" position="0 0 0.3"
                      animation__float="property: position;
                              from: 0 -0.03 0.3;
                              to: 0 0.05 0.3;
                              dir: alternate;
                              dur: 1800;
                              loop: true;
                              easing: easeInOutSine;">

                <!-- Rotação contínua -->
                <a-entity animation__spin="property: rotation;
                             from: 0 0 0;
                             to: 0 0 360;
                             dur: 15000;
                             loop: true;
                             easing: linear;">

                    <!-- Modelo com orientação corrigida -->
                    <a-entity id="trofeu"
                              gltf-model="#trofeuModel"
                              rotation="90 0 0"
                              scale="0.3 0.3 0.3"></a-entity>

                </a-entity>
            </a-entity>
        </a-entity>
        <a-entity id="grvTarget2" mindar-image-target="targetIndex: 1">

        
            <a-entity id="trofeuContainer2" position="0 0 0.3">
                <a-entity id="trofeu2"
                          gltf-model="#pucrsLogoModel"
                          rotation="90 0 0"
                          scale="2.7 2.7 2.7">
                </a-entity>
            </a-entity>

        </a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
  </section>

  <script src="script.js"></script>
</body>
</html>
